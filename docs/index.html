<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Workspace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d14;
      color: #eee;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      overflow: hidden;
      height: 100vh;
    }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #status {
      position: fixed; top: 10px; left: 12px;
      font-size: 11px; color: #555; z-index: 10;
      letter-spacing: 0.5px;
    }
    #status .live { color: #4fc3f7; }
    #status .mock { color: #ffb74d; }
    #status .error { color: #f44336; }
    #legend {
      position: fixed; bottom: 12px; left: 12px;
      font-size: 11px; color: #555;
      display: flex; gap: 14px; z-index: 10;
    }
    #legend .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
    #panel {
      position: fixed; right: 0; top: 0;
      width: 360px; height: 100%;
      background: #141420;
      border-left: 1px solid #1f1f30;
      padding: 18px; overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.18s ease;
      z-index: 20;
      font-size: 13px;
    }
    #panel.open { transform: translateX(0); }
    #panel h2 {
      font-size: 10px; color: #666;
      text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    #panel h3 { font-size: 15px; margin-bottom: 6px; word-break: break-all; }
    #panel .meta { color: #888; font-size: 11px; margin-bottom: 12px; }
    #panel .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1f1f30; }
    #panel .row .k { color: #777; }
    #panel .row .v { color: #ccc; font-variant-numeric: tabular-nums; }
    .message {
      background: #0d0d14; border-radius: 4px;
      padding: 8px 10px; margin-bottom: 6px;
      font-size: 12px; line-height: 1.4;
    }
    .message .from { color: #4fc3f7; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .message.assistant .from { color: #81c784; }
    .message .text { color: #ccc; white-space: pre-wrap; }
    #tooltip {
      position: fixed;
      background: #1f1f30; color: #eee;
      padding: 5px 9px; border-radius: 3px;
      font-size: 11px; pointer-events: none;
      display: none; z-index: 30;
      border: 1px solid #2a2a40;
    }
    #close-panel {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #666;
      cursor: pointer; font-size: 16px;
    }
    #close-panel:hover { color: #eee; }
  </style>
</head>
<body>
  <div id="status">init</div>
  <canvas id="graph"></canvas>
  <div id="legend">
    <span><span class="swatch" style="background:#4fc3f7"></span>main</span>
    <span><span class="swatch" style="background:#81c784"></span>subagent</span>
    <span><span class="swatch" style="background:#ffb74d"></span>direct</span>
    <span><span class="swatch" style="background:#666"></span>inactive</span>
    <span style="color:#444">click node/edge for details</span>
  </div>
  <div id="panel">
    <button id="close-panel">×</button>
    <h2>Details</h2>
    <div id="panel-content"></div>
  </div>
  <div id="tooltip"></div>

  <script>
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('panel');
    const panelContent = document.getElementById('panel-content');
    const tooltip = document.getElementById('tooltip');
    const statusEl = document.getElementById('status');
    document.getElementById('close-panel').onclick = () => panel.classList.remove('open');

    const POLL_INTERVAL = 5000;
    // When deployed on GitHub Pages, fall back to fetching live data from the `data` branch.
    const DATA_URL_LOCAL = './data/graph.json';
    const DATA_URL_REMOTE = 'https://raw.githubusercontent.com/o29352008-spec/agent-workspace/data/data/graph.json';
    const KIND_COLORS = {
      main: '#4fc3f7',
      subagent: '#81c784',
      direct: '#ffb74d',
      thread: '#ce93d8',
      session: '#90a4ae',
    };

    let nodes = [];
    let edges = [];
    let pulses = [];
    let dragging = null;
    let offsetX = 0, offsetY = 0;
    let isLive = false;
    let lastFetchOk = 0;

    // Mock for offline preview
    const MOCK_GRAPH = {
      generatedAt: Date.now(),
      nodes: [
        { id: 'agent:main:main', label: 'main', kind: 'main', active: true, model: 'claude-opus-4.7', totalTokens: 118934, contextTokens: 200000, ageMs: 30000, recentMessages: [
          { role: 'user', text: 'add medieval visuals' },
          { role: 'assistant', text: 'scrapped, going brutal-efficient instead' },
        ]},
        { id: 'agent:main:subagent:demo-1', label: 'demo-1', kind: 'subagent', active: false, spawnedBy: 'agent:main:main', spawnLabel: 'test-subagent-1', model: 'claude-opus-4.6', totalTokens: 136, ageMs: 1200000, recentMessages: [{ role: 'assistant', text: 'task complete' }] },
        { id: 'agent:main:subagent:demo-2', label: 'demo-2', kind: 'subagent', active: true, spawnedBy: 'agent:main:main', spawnLabel: 'researcher', model: 'gemini-3-pro', totalTokens: 8200, ageMs: 60000, recentMessages: [] },
        { id: 'agent:main:direct:web-x', label: 'web-x', kind: 'direct', active: false, model: '', totalTokens: 0, ageMs: 5000000, recentMessages: [] },
      ],
      edges: [
        { from: 'agent:main:main', to: 'agent:main:subagent:demo-1', kind: 'spawn', label: 'test-subagent-1', lastActivity: Date.now() - 1200000 },
        { from: 'agent:main:main', to: 'agent:main:subagent:demo-2', kind: 'spawn', label: 'researcher', lastActivity: Date.now() - 60000 },
      ],
    };

    // --- Force-directed layout ---
    class ForceLayout {
      constructor() {
        this.alpha = 1;
        this.decay = 0.985;
        this.minAlpha = 0.001;
        this.repulsion = 9000;
        this.attraction = 0.005;
        this.damping = 0.82;
        this.centerForce = 0.014;
        this.running = false;
      }
      kick(amt = 0.4) { this.alpha = Math.max(this.alpha, amt); this.running = true; }
      tick() {
        if (!this.running || this.alpha < this.minAlpha) { this.running = false; return; }
        const cx = canvas.width / 2, cy = canvas.height / 2;
        for (const n of nodes) { if (!n.vx) n.vx = 0; if (!n.vy) n.vy = 0; }
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            const force = this.repulsion / (dist*dist);
            const fx = (dx/dist) * force * this.alpha;
            const fy = (dy/dist) * force * this.alpha;
            a.vx += fx; a.vy += fy;
            b.vx -= fx; b.vy -= fy;
          }
        }
        for (const e of edges) {
          const a = getNode(e.from), b = getNode(e.to);
          if (!a || !b) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          const force = dist * this.attraction * this.alpha;
          const fx = (dx/dist) * force, fy = (dy/dist) * force;
          a.vx += fx; a.vy += fy;
          b.vx -= fx; b.vy -= fy;
        }
        for (const n of nodes) {
          n.vx += (cx - n.x) * this.centerForce * this.alpha;
          n.vy += (cy - n.y) * this.centerForce * this.alpha;
        }
        for (const n of nodes) {
          if (n === dragging) continue;
          n.vx *= this.damping; n.vy *= this.damping;
          n.x += n.vx; n.y += n.vy;
          const r = nodeRadius(n);
          n.x = Math.max(r + 20, Math.min(canvas.width - r - 20, n.x));
          n.y = Math.max(r + 20, Math.min(canvas.height - r - 20, n.y));
        }
        this.alpha *= this.decay;
      }
    }
    const layout = new ForceLayout();

    function getNode(id) { return nodes.find(n => n.id === id); }

    function nodeRadius(n) {
      // Scale node by token usage (log-ish) but bounded
      const base = n.kind === 'main' ? 32 : 24;
      const t = Math.log10((n.totalTokens || 0) + 10) * 2;
      return Math.max(base, Math.min(base + t, 50));
    }

    function nodeColor(n) {
      return KIND_COLORS[n.kind] || KIND_COLORS.session;
    }

    // --- Live data ---
    async function fetchLive() {
      try {
        // Try local first (works when running with refresh-data.sh writing to ./data/)
        let resp = await fetch(DATA_URL_LOCAL + '?t=' + Date.now()).catch(() => null);
        if (!resp || !resp.ok) {
          resp = await fetch(DATA_URL_REMOTE + '?t=' + Date.now());
        }
        if (!resp.ok) throw new Error('graph ' + resp.status);
        const g = await resp.json();
        applyGraph(g);
        isLive = true;
        lastFetchOk = Date.now();
        const ago = ((Date.now() - g.generatedAt) / 1000).toFixed(0);
        statusEl.innerHTML = '<span class="live">● live</span> · ' + nodes.length + ' nodes · ' + edges.length + ' edges · data ' + ago + 's old';
      } catch (e) {
        if (!isLive && nodes.length === 0) {
          applyGraph(MOCK_GRAPH);
          statusEl.innerHTML = '<span class="mock">● demo</span> · ' + e.message;
        } else if (isLive && Date.now() - lastFetchOk > 30000) {
          statusEl.innerHTML = '<span class="error">● stale</span> · ' + e.message;
        }
      }
    }

    function applyGraph(g) {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const existing = {};
      for (const n of nodes) existing[n.id] = n;

      const newNodes = g.nodes.map((raw) => {
        const prev = existing[raw.id];
        return {
          ...raw,
          x: prev ? prev.x : cx + (Math.random() - 0.5) * 400,
          y: prev ? prev.y : cy + (Math.random() - 0.5) * 300,
          vx: prev ? prev.vx : 0,
          vy: prev ? prev.vy : 0,
        };
      });

      const newKeys = new Set(newNodes.map(n => n.id));
      const oldKeys = new Set(nodes.map(n => n.id));
      const topologyChanged = newNodes.length !== nodes.length ||
        [...newKeys].some(k => !oldKeys.has(k));

      nodes = newNodes;
      edges = g.edges || [];

      if (topologyChanged) layout.kick(0.6);

      // Spawn pulses on recently-active edges
      const now = Date.now();
      for (const e of edges) {
        const ageSec = (now - (e.lastActivity || 0)) / 1000;
        if (ageSec < 30 && Math.random() < 0.2) spawnPulse(e);
      }
    }

    // --- Pulses ---
    function spawnPulse(edge) {
      const a = getNode(edge.from);
      pulses.push({
        edge, t: 0, speed: 0.014 + Math.random() * 0.008,
        color: a ? nodeColor(a) : '#4fc3f7',
      });
    }
    function updatePulses() {
      pulses = pulses.filter(p => { p.t += p.speed; return p.t < 1; });
    }

    // --- Render ---
    function draw() {
      ctx.fillStyle = '#0d0d14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Edges
      for (const e of edges) {
        const a = getNode(e.from), b = getNode(e.to);
        if (!a || !b) continue;
        const recent = (Date.now() - (e.lastActivity || 0)) < 60000;
        ctx.strokeStyle = recent ? 'rgba(129, 199, 132, 0.55)' : 'rgba(80, 80, 100, 0.4)';
        ctx.lineWidth = recent ? 2 : 1.2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        // Arrow on parent->child
        if (e.kind === 'spawn') {
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          const r = nodeRadius(b);
          const tx = b.x - Math.cos(ang) * (r + 2);
          const ty = b.y - Math.sin(ang) * (r + 2);
          ctx.fillStyle = recent ? 'rgba(129, 199, 132, 0.7)' : 'rgba(120, 120, 140, 0.5)';
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx - Math.cos(ang - 0.4) * 8, ty - Math.sin(ang - 0.4) * 8);
          ctx.lineTo(tx - Math.cos(ang + 0.4) * 8, ty - Math.sin(ang + 0.4) * 8);
          ctx.closePath();
          ctx.fill();
        }
      }

      // Pulses
      for (const p of pulses) {
        const a = getNode(p.edge.from), b = getNode(p.edge.to);
        if (!a || !b) continue;
        const x = a.x + (b.x - a.x) * p.t;
        const y = a.y + (b.y - a.y) * p.t;
        const alpha = Math.sin(p.t * Math.PI);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color + Math.floor(alpha * 220).toString(16).padStart(2, '0');
        ctx.fill();
      }

      // Nodes
      for (const n of nodes) {
        const r = nodeRadius(n);
        const color = nodeColor(n);

        if (n.active) {
          const pulse = 1 + Math.sin(Date.now() / 600) * 0.06;
          const grad = ctx.createRadialGradient(n.x, n.y, r, n.x, n.y, (r + 12) * pulse);
          grad.addColorStop(0, color + '40');
          grad.addColorStop(1, color + '00');
          ctx.beginPath();
          ctx.arc(n.x, n.y, (r + 12) * pulse, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }

        // Body
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#141420';
        ctx.fill();
        ctx.strokeStyle = n.active ? color : color + '55';
        ctx.lineWidth = n.active ? 2 : 1.3;
        ctx.stroke();

        // Label
        ctx.fillStyle = n.active ? '#eee' : '#888';
        ctx.font = 'bold 11px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = n.label.length > 11 ? n.label.slice(0, 10) + '…' : n.label;
        ctx.fillText(label, n.x, n.y - 3);

        ctx.fillStyle = '#666';
        ctx.font = '9px ui-monospace, monospace';
        ctx.fillText(n.kind, n.x, n.y + 9);

        // Active dot
        if (n.active) {
          ctx.beginPath();
          ctx.arc(n.x + r - 4, n.y - r + 4, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#4caf50';
          ctx.fill();
          ctx.strokeStyle = '#0d0d14';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    function hitTest(x, y) {
      for (const n of nodes) {
        const r = nodeRadius(n);
        const dx = x - n.x, dy = y - n.y;
        if (dx*dx + dy*dy < r*r) return { type: 'node', node: n };
      }
      // Edge hit: midpoint within 14px
      for (const e of edges) {
        const a = getNode(e.from), b = getNode(e.to);
        if (!a || !b) continue;
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = x - mx, dy = y - my;
        if (dx*dx + dy*dy < 14*14) return { type: 'edge', edge: e };
      }
      return null;
    }

    function fmtAge(ms) {
      if (!ms || ms < 0) return '—';
      const s = Math.round(ms / 1000);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      return Math.round(s / 86400) + 'd ago';
    }
    function fmtCost(c) { return c ? '$' + c.toFixed(4) : '—'; }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showNode(n) {
      const ctxPct = n.contextTokens ? Math.round(((n.totalTokens || 0) / n.contextTokens) * 100) : 0;
      const messagesHtml = (n.recentMessages || []).map(m =>
        `<div class="message ${m.role}"><div class="from">${m.role}</div><div class="text">${escapeHtml(m.text)}</div></div>`
      ).join('') || '<div style="color:#555;font-size:12px">no recent messages</div>';

      panelContent.innerHTML = `
        <h3>${escapeHtml(n.label)}</h3>
        <div class="meta">${escapeHtml(n.kind)} ${n.active ? '· <span style="color:#4caf50">active</span>' : '· inactive'}</div>
        <div class="row"><span class="k">id</span><span class="v" style="font-size:10px">${escapeHtml(n.id)}</span></div>
        <div class="row"><span class="k">model</span><span class="v">${escapeHtml(n.model || '—')}</span></div>
        <div class="row"><span class="k">tokens</span><span class="v">${(n.totalTokens || 0).toLocaleString()}${ctxPct ? ` (${ctxPct}% ctx)` : ''}</span></div>
        <div class="row"><span class="k">cost</span><span class="v">${fmtCost(n.cost)}</span></div>
        <div class="row"><span class="k">channel</span><span class="v">${escapeHtml(n.channel || '—')}</span></div>
        <div class="row"><span class="k">last</span><span class="v">${fmtAge(n.ageMs)}</span></div>
        ${n.spawnedBy ? `<div class="row"><span class="k">parent</span><span class="v" style="font-size:10px">${escapeHtml(n.spawnedBy.split(':').pop())}</span></div>` : ''}
        ${n.spawnLabel ? `<div class="row"><span class="k">label</span><span class="v">${escapeHtml(n.spawnLabel)}</span></div>` : ''}
        <h2 style="margin-top:18px">Recent</h2>
        ${messagesHtml}
      `;
      panel.classList.add('open');
    }

    function showEdge(e) {
      const a = getNode(e.from), b = getNode(e.to);
      panelContent.innerHTML = `
        <h3>${escapeHtml(a?.label || '?')} → ${escapeHtml(b?.label || '?')}</h3>
        <div class="meta">${escapeHtml(e.kind)} edge</div>
        <div class="row"><span class="k">label</span><span class="v">${escapeHtml(e.label || '—')}</span></div>
        <div class="row"><span class="k">last activity</span><span class="v">${fmtAge(Date.now() - (e.lastActivity || 0))}</span></div>
      `;
      spawnPulse(e);
      panel.classList.add('open');
    }

    canvas.addEventListener('mousedown', (ev) => {
      const hit = hitTest(ev.clientX, ev.clientY);
      if (hit && hit.type === 'node') {
        dragging = hit.node;
        offsetX = ev.clientX - hit.node.x;
        offsetY = ev.clientY - hit.node.y;
        layout.kick(0.3);
      }
    });
    canvas.addEventListener('mousemove', (ev) => {
      if (dragging) {
        dragging.x = ev.clientX - offsetX;
        dragging.y = ev.clientY - offsetY;
        dragging.vx = 0; dragging.vy = 0;
        return;
      }
      const hit = hitTest(ev.clientX, ev.clientY);
      if (hit) {
        canvas.style.cursor = 'pointer';
        tooltip.style.display = 'block';
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 10) + 'px';
        if (hit.type === 'node') {
          tooltip.textContent = hit.node.label + ' · ' + hit.node.kind + (hit.node.active ? ' · active' : '');
        } else {
          const a = getNode(hit.edge.from), b = getNode(hit.edge.to);
          tooltip.textContent = (a?.label || '?') + ' → ' + (b?.label || '?');
        }
      } else {
        canvas.style.cursor = 'grab';
        tooltip.style.display = 'none';
      }
    });
    canvas.addEventListener('mouseup', () => { dragging = null; });
    canvas.addEventListener('click', (ev) => {
      const hit = hitTest(ev.clientX, ev.clientY);
      if (hit && hit.type === 'node') showNode(hit.node);
      else if (hit && hit.type === 'edge') showEdge(hit.edge);
      else panel.classList.remove('open');
    });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function loop() {
      layout.tick();
      updatePulses();
      draw();
      requestAnimationFrame(loop);
    }
    window.addEventListener('resize', resize);
    resize();

    fetchLive();
    setInterval(fetchLive, POLL_INTERVAL);
    loop();
  </script>
</body>
</html>
